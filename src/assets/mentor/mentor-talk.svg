<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" focusable="false" aria-hidden="true">
  <defs>
    <clipPath id="mentorBodyTalk">
      <ellipse cx="44" cy="60" rx="25" ry="19" transform="rotate(-14 44 60)"/>
    </clipPath>
  </defs>

  <g class="mentor-flag">
    <path d="M65 12C80 16 86 26 82 38 81 27 72 19 63 15Z" fill="#14161a" stroke="#14161a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M65 12C80 16 86 26 82 38 81 27 72 19 63 15Z" fill="#efd3da"/>
  </g>

  <g class="mentor-feet">
    <rect x="29" y="78" width="13" height="9" rx="4.5" fill="#14161a"/>
    <rect x="46" y="78" width="13" height="9" rx="4.5" fill="#14161a"/>
  </g>

  <rect x="62" y="10" width="9" height="46" rx="4.5" fill="#14161a"/>

  <!-- Dua lengan turun ke samping: pose sedang menjelaskan; mulutnya bergerak
       selama teks di balon masih diketik. -->
  <g class="mentor-arm">
    <path d="M22 54 12 66" fill="none" stroke="#14161a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="10" cy="68" r="6.5" fill="#e9e9ee" stroke="#14161a" stroke-width="3"/>
    <path d="M66 52 76 64" fill="none" stroke="#14161a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="78" cy="66" r="6.5" fill="#e9e9ee" stroke="#14161a" stroke-width="3"/>
  </g>

  <ellipse cx="44" cy="60" rx="27.5" ry="21.5" transform="rotate(-14 44 60)" fill="#14161a"/>
  <g clip-path="url(#mentorBodyTalk)">
    <ellipse cx="44" cy="60" rx="25" ry="19" fill="#d5d5e0"/>
    <ellipse cx="51" cy="54" rx="25" ry="19" fill="#e9e9ee"/>
  </g>

  <g transform="rotate(-14 44 60)">
    <g class="mentor-eyes">
      <circle cx="35" cy="55.5" r="6.2" fill="#ffffff" stroke="#14161a" stroke-width="2.6"/>
      <circle cx="35" cy="55.5" r="2.5" fill="#14161a"/>
      <circle cx="53" cy="55.5" r="6.2" fill="#ffffff" stroke="#14161a" stroke-width="2.6"/>
      <circle cx="53" cy="55.5" r="2.5" fill="#14161a"/>
    </g>
    <g class="mentor-mouth">
      <rect x="38.5" y="63.6" width="11" height="6.6" rx="3.3" fill="#14161a"/>
    </g>
  </g>
</svg>
